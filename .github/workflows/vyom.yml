name: Build Vyom EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:

      # ------------------------------------------------------
      # CHECKOUT REPOSITORY
      # ------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # SETUP PYTHON
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ------------------------------------------------------
      # INSTALL DEPENDENCIES
      # ------------------------------------------------------

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install SpeechRecognition
          pip install PyAudio

      # ------------------------------------------------------
      # BUILD VYOM EXE
      # ------------------------------------------------------
      #
      # Collect all ai_core modules.
      #
      # This includes:
      #
      # ai_core.autonomous_agent
      # ai_core.brain
      # ai_core.reasoning_engine
      # ai_core.skill_builder
      # and other ai_core modules.
      #
      # Tools modules are also collected.
      #
      # ------------------------------------------------------

      - name: Build Vyom EXE
        run: |
          pyinstaller --onefile --console --paths "." --collect-submodules ai_core --collect-submodules tools --hidden-import ai_core.autonomous_agent --hidden-import ai_core.skill_builder --hidden-import tools.universal_app_launcher ai_core/main.py --name Vyom

      # ------------------------------------------------------
      # BUILD VOICE TEST EXE
      # ------------------------------------------------------

      - name: Build Vyom Voice Test EXE
        run: |
          pyinstaller --onefile --console --paths "." --collect-submodules voice --hidden-import voice.speech_to_text voice/exe_test.py --name Vyom_Voice_Test

      # ------------------------------------------------------
      # UPLOAD VYOM EXE
      # ------------------------------------------------------

      - name: Upload Vyom EXE
        uses: actions/upload-artifact@v4
        with:
          name: Vyom_EXE
          path: dist/Vyom.exe

      # ------------------------------------------------------
      # UPLOAD VOICE TEST EXE
      # ------------------------------------------------------

      - name: Upload Voice Test EXE
        uses: actions/upload-artifact@v4
        with:
          name: Vyom_Voice_EXE
          path: dist/Vyom_Voice_Test.exe
