name: Build Vyom EXE

on:
  workflow_dispatch:

jobs:

  build:

    runs-on: windows-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          if (Test-Path "requirements.txt") {
              python -m pip install -r requirements.txt
          }
          python -m pip install SpeechRecognition
          python -m pip install PyAudio
          python -m pip install pyttsx3

      - name: Verify Project Structure
        shell: powershell
        run: |
          $requiredFiles = @(
              "ai_core/main.py",
              "ai_core/autonomous_agent.py",
              "ai_core/brain.py",
              "ai_core/goal_compiler.py",
              "ai_core/goal_router.py",
              "ai_core/reasoning_engine.py",
              "ai_core/deep_reasoner.py",
              "ai_core/model_gateway.py",
              "ai_core/mission_planner.py",
              "ai_core/mission_runtime.py",
              "ai_core/observation_verifier.py",
              "ai_core/world_state.py",
              "ai_core/skill_builder.py",
              "ai_core/skill_registry.py",
              "command_engine/executor.py",
              "command_engine/intent.py",
              "tools/tool_manager.py",
              "tools/universal_resolver.py",
              "tools/universal_app_launcher.py",
              "memory/session_memory.py",
              "memory/selection_manager.py",
              "windows_agent/process_manager.py",
              "voice/voice_controller.py",
              "voice/speech_to_text.py",
              "voice/text_to_speech.py"
          )
          foreach ($file in $requiredFiles) {
              if (!(Test-Path $file)) {
                  Write-Error "Missing required file: $file"
                  exit 1
              }
              Write-Host "FOUND: $file"
          }
          Write-Host "All required files exist."

      - name: Check Python Syntax
        shell: powershell
        run: |
          python -m compileall -q `
            ai_core `
            command_engine `
            tools `
            memory `
            windows_agent `
            voice `
            tests
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Python syntax check failed."
              exit 1
          }
          Write-Host "Python syntax check PASSED."

      - name: Test Vyom Imports
        shell: powershell
        run: |
          python -c "import ai_core; import ai_core.brain; import ai_core.goal_compiler; import ai_core.goal_router; import ai_core.reasoning_engine; import ai_core.deep_reasoner; import ai_core.model_gateway; import ai_core.mission_planner; import ai_core.mission_runtime; import ai_core.observation_verifier; import ai_core.world_state; import ai_core.skill_registry; import ai_core.skill_builder; import ai_core.autonomous_agent; import command_engine.intent; import command_engine.executor; import tools.tool_manager; import tools.universal_resolver; import memory.session_memory; import memory.selection_manager; import windows_agent.process_manager; print('VYOM CORE IMPORT TEST PASSED')"
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Vyom core import test failed."
              exit 1
          }

      - name: Test Voice Imports
        shell: powershell
        run: |
          python -c "import voice; import voice.voice_controller; import voice.speech_to_text; import voice.text_to_speech; print('VOICE IMPORT TEST PASSED')"
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Voice import test failed."
              exit 1
          }

      - name: Run Unit Test Suite
        shell: powershell
        run: |
          python -m unittest discover -s tests -p "test*.py" -v
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Vyom unit test suite failed."
              exit 1
          }
          Write-Host "VYOM UNIT TEST SUITE PASSED."

      - name: Test Skill System
        shell: powershell
        run: |
          python -c "from ai_core.skill_builder import SkillBuilder; builder=SkillBuilder(); result=builder.build('photo se excel banana'); print(result); print('SKILL SYSTEM TEST PASSED')"
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Skill system test failed."
              exit 1
          }

      - name: Clean Build
        shell: powershell
        run: |
          if (Test-Path "build") { Remove-Item -Recurse -Force "build" }
          if (Test-Path "dist") { Remove-Item -Recurse -Force "dist" }
          if (Test-Path "Vyom.spec") { Remove-Item -Force "Vyom.spec" }

      - name: Build Complete Vyom EXE
        shell: powershell
        run: |
          python -m PyInstaller `
            --onefile `
            --clean `
            --noconfirm `
            --console `
            --paths "." `
            --collect-submodules ai_core `
            --collect-submodules command_engine `
            --collect-submodules tools `
            --collect-submodules memory `
            --collect-submodules windows_agent `
            --collect-submodules voice `
            --hidden-import ai_core.autonomous_agent `
            --hidden-import ai_core.brain `
            --hidden-import ai_core.goal_compiler `
            --hidden-import ai_core.goal_router `
            --hidden-import ai_core.reasoning_engine `
            --hidden-import ai_core.deep_reasoner `
            --hidden-import ai_core.model_gateway `
            --hidden-import ai_core.capability_manager `
            --hidden-import ai_core.mission_planner `
            --hidden-import ai_core.mission_runtime `
            --hidden-import ai_core.observation_verifier `
            --hidden-import ai_core.world_state `
            --hidden-import ai_core.skill_builder `
            --hidden-import ai_core.skill_registry `
            --hidden-import command_engine.executor `
            --hidden-import command_engine.intent `
            --hidden-import tools.tool_manager `
            --hidden-import tools.universal_resolver `
            --hidden-import tools.universal_app_launcher `
            --hidden-import memory.session_memory `
            --hidden-import memory.selection_manager `
            --hidden-import windows_agent.process_manager `
            --hidden-import voice.voice_controller `
            --hidden-import voice.speech_to_text `
            --hidden-import voice.text_to_speech `
            --name Vyom `
            ai_core/main.py
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Vyom.exe build failed."
              exit 1
          }
          Write-Host "Vyom.exe build completed successfully."

      - name: Verify Vyom EXE
        shell: powershell
        run: |
          if (!(Test-Path "dist/Vyom.exe")) {
              Write-Error "Vyom.exe was not created."
              exit 1
          }
          $size = (Get-Item "dist/Vyom.exe").Length
          Write-Host "Vyom.exe size: $size bytes"
          if ($size -lt 100000) {
              Write-Error "Vyom.exe appears too small."
              exit 1
          }
          Write-Host "COMPLETE VYOM EXE VERIFIED."

      - name: Upload Vyom EXE
        uses: actions/upload-artifact@v4
        with:
          name: Vyom_EXE
          path: dist/Vyom.exe
          if-no-files-found: error
          retention-days: 7

      - name: Build Summary
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "             VYOM BUILD SUCCESS"
          Write-Host "=============================================="
          Write-Host "ONE COMPLETE EXE CREATED: dist/Vyom.exe"
          Write-Host "ONE ARTIFACT CREATED: Vyom_EXE"
          Write-Host "=============================================="
