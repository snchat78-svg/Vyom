name: Build Vyom EXE

run-name: Vyom EXE | branch=${{ github.ref_name }} | commit=${{ github.sha }}

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Verify Exact Build Source
        shell: powershell
        run: |
          Write-Host "BUILD BRANCH: $env:GITHUB_REF_NAME"
          Write-Host "BUILD REF:    $env:GITHUB_REF"
          Write-Host "BUILD SHA:    $env:GITHUB_SHA"

          $checked = git rev-parse HEAD
          Write-Host "CHECKED SHA:  $checked"

          if ($checked -ne $env:GITHUB_SHA) {
              Write-Error "Checked source does not match workflow SHA."
              exit 1
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pytest

          if (Test-Path "requirements.txt") {
              python -m pip install -r requirements.txt
          }

          python -m pip install SpeechRecognition PyAudio pyttsx3

      - name: Verify All Tracked Python Files
        shell: powershell
        run: |
          $trackedPython = @(git ls-files "*.py")

          if ($trackedPython.Count -eq 0) {
              Write-Error "No tracked Python files were found."
              exit 1
          }

          Write-Host "TRACKED PYTHON FILE COUNT: $($trackedPython.Count)"

          foreach ($file in $trackedPython) {
              if (!(Test-Path $file)) {
                  Write-Error "Tracked Python file is missing from checkout: $file"
                  exit 1
              }
          }

          Write-Host "ALL TRACKED PYTHON FILES ARE PRESENT."

      - name: Verify Critical Runtime Modules
        shell: powershell
        run: |
          $requiredFiles = @(
              "main.py",
              "requirements.txt",
              "ai_core/__init__.py",
              "ai_core/main.py",
              "ai_core/autonomous_agent.py",
              "ai_core/brain.py",
              "ai_core/capability_manager.py",
              "ai_core/capability_executor.py",
              "ai_core/capability_registry.py",
              "ai_core/capability_resolver.py",
              "ai_core/action_schema.py",
              "ai_core/action_validator.py",
              "ai_core/config.py",
              "ai_core/conversation_manager.py",
              "ai_core/conversation_result.py",
              "ai_core/deep_reasoner.py",
              "ai_core/goal_compiler.py",
              "ai_core/goal_router.py",
              "ai_core/logger.py",
              "ai_core/mission_planner.py",
              "ai_core/mission_runtime.py",
              "ai_core/model_gateway.py",
              "ai_core/observation_verifier.py",
              "ai_core/reasoning_engine.py",
              "ai_core/reasoning_gateway.py",
              "ai_core/response_engine.py",
              "ai_core/skill_builder.py",
              "ai_core/skill_registry.py",
              "ai_core/ui_autonomous_agent.py",
              "ai_core/world_state.py",
              "command_engine/__init__.py",
              "command_engine/executor.py",
              "command_engine/intent.py",
              "command_engine/multilingual_command.py",
              "command_engine/parser.py",
              "tools/__init__.py",
              "tools/app_registry.py",
              "tools/file_manager.py",
              "tools/tool_manager.py",
              "tools/universal_app_launcher.py",
              "tools/universal_resolver.py",
              "memory/selection_manager.py",
              "memory/session_memory.py",
              "windows_agent/__init__.py",
              "windows_agent/clipboard_manager.py",
              "windows_agent/input_controller.py",
              "windows_agent/launcher.py",
              "windows_agent/process_manager.py",
              "windows_agent/screen_observer.py",
              "windows_agent/ui_automation.py",
              "windows_agent/window_manager.py",
              "voice/__init__.py",
              "voice/speech_to_text.py",
              "voice/text_to_speech.py",
              "voice/voice_controller.py",
              "tests/test_action_core.py",
              "tests/test_conversation_manager.py",
              "tests/test_deep_reasoner_gateway.py",
              "tests/test_generic_reasoning_integration.py",
              "tests/test_goal_intelligence.py",
              "tests/test_mission_planner_generic_actions.py",
              "tests/test_model_gateway_protocol.py",
              "tests/test_reasoning_core_wiring.py",
              "tests/test_reasoning_gateway.py",
              "tests/test_ui_autonomous_agent.py",
              "tests/test_voice_conversation_integration.py",
              "tests/test_windows_ui_capability.py"
          )

          foreach ($file in $requiredFiles) {
              if (!(Test-Path $file)) {
                  Write-Error "Missing critical runtime/test file: $file"
                  exit 1
              }
          }

          Write-Host "ALL CRITICAL RUNTIME AND TEST FILES ARE PRESENT."

      - name: Python Syntax Check
        shell: powershell
        run: |
          python -m compileall -q `
            ai_core `
            command_engine `
            tools `
            memory `
            windows_agent `
            voice `
            tests

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Python syntax check failed."
              exit 1
          }

          Write-Host "PYTHON SYNTAX CHECK PASSED."

      - name: Core Import Check
        shell: powershell
        run: |
          python -c "import ai_core; import ai_core.main; import ai_core.autonomous_agent; import ai_core.brain; import ai_core.capability_manager; import ai_core.capability_executor; import ai_core.capability_registry; import ai_core.capability_resolver; import ai_core.action_schema; import ai_core.action_validator; import ai_core.config; import ai_core.conversation_manager; import ai_core.conversation_result; import ai_core.deep_reasoner; import ai_core.goal_compiler; import ai_core.goal_router; import ai_core.logger; import ai_core.mission_planner; import ai_core.mission_runtime; import ai_core.model_gateway; import ai_core.observation_verifier; import ai_core.reasoning_engine; import ai_core.reasoning_gateway; import ai_core.response_engine; import ai_core.skill_builder; import ai_core.skill_registry; import ai_core.ui_autonomous_agent; import ai_core.world_state; import command_engine.executor; import command_engine.intent; import command_engine.multilingual_command; import command_engine.parser; import tools.tool_manager; import tools.universal_app_launcher; import tools.universal_resolver; import memory.selection_manager; import memory.session_memory; import windows_agent.clipboard_manager; import windows_agent.input_controller; import windows_agent.launcher; import windows_agent.process_manager; import windows_agent.screen_observer; import windows_agent.ui_automation; import windows_agent.window_manager; print('VYOM CORE + STEP2 IMPORT TEST PASSED')"

      - name: Voice Import Check
        shell: powershell
        run: |
          python -c "import voice; import voice.voice_controller; import voice.speech_to_text; import voice.text_to_speech; print('VOICE IMPORT TEST PASSED')"

      - name: Run Complete Test Suite
        shell: powershell
        run: |
          python -m pytest tests -q
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Pytest suite failed. EXE build stopped."
              exit 1
          }
          Write-Host "COMPLETE PYTEST SUITE PASSED."

      - name: Clean Build
        shell: powershell
        run: |
          if (Test-Path "build") { Remove-Item -Recurse -Force "build" }
          if (Test-Path "dist") { Remove-Item -Recurse -Force "dist" }
          if (Test-Path "Vyom.spec") { Remove-Item -Force "Vyom.spec" }

      - name: Build Complete Vyom EXE
        shell: powershell
        run: |
          python -m PyInstaller `
            --onefile `
            --clean `
            --noconfirm `
            --console `
            --paths "." `
            --collect-submodules ai_core `
            --collect-submodules command_engine `
            --collect-submodules tools `
            --collect-submodules memory `
            --collect-submodules windows_agent `
            --collect-submodules voice `
            --name Vyom `
            ai_core/main.py

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Vyom.exe build failed."
              exit 1
          }

          Write-Host "Vyom.exe build completed successfully."

      - name: Verify Vyom EXE
        shell: powershell
        run: |
          if (!(Test-Path "dist/Vyom.exe")) {
              Write-Error "Vyom.exe was not created."
              exit 1
          }

          $size = (Get-Item "dist/Vyom.exe").Length
          Write-Host "Vyom.exe size: $size bytes"

          if ($size -lt 100000) {
              Write-Error "Vyom.exe appears too small."
              exit 1
          }

          Write-Host "VYOM EXE VERIFIED."

      - name: Upload Vyom EXE
        uses: actions/upload-artifact@v4
        with:
          name: Vyom_EXE
          path: dist/Vyom.exe
          if-no-files-found: error
          retention-days: 7

      - name: Build Summary
        shell: powershell
        run: |
          Write-Host "=============================================="
          Write-Host " VYOM BUILD SUCCESS"
          Write-Host " Branch: $env:GITHUB_REF_NAME"
          Write-Host " SHA:    $env:GITHUB_SHA"
          Write-Host "=============================================="
