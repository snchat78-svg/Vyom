name: Build Vyom EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Vyom EXE
        run: |
          pyinstaller --onefile --paths "." --collect-submodules tools --hidden-import tools.universal_app_launcher ai_core/main.py --name Vyom

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Vyom_EXE
          path: dist/Vyom.exe
