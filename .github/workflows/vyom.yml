name: Build Vyom EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install SpeechRecognition
          pip install PyAudio

      # ------------------------------------------------------
      # EXISTING VYOM EXE
      # ------------------------------------------------------

      - name: Build Vyom EXE
        run: |
          pyinstaller --onefile --console --paths "." --collect-submodules tools --hidden-import tools.universal_app_launcher ai_core/main.py --name Vyom

      # ------------------------------------------------------
      # VOICE TEST EXE
      # ------------------------------------------------------

      - name: Build Vyom Voice Test EXE
        run: |
          pyinstaller --onefile --console --paths "." --collect-submodules voice --hidden-import voice.speech_to_text voice/exe_test.py --name Vyom_Voice_Test

      # ------------------------------------------------------
      # UPLOAD EXISTING VYOM
      # ------------------------------------------------------

      - name: Upload Vyom EXE
        uses: actions/upload-artifact@v4
        with:
          name: Vyom_EXE
          path: dist/Vyom.exe

      # ------------------------------------------------------
      # UPLOAD VOICE TEST
      # ------------------------------------------------------

      - name: Upload Voice Test EXE
        uses: actions/upload-artifact@v4
        with:
          name: Vyom_Voice_EXE
          path: dist/Vyom_Voice_Test.exe
