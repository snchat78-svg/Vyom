name: Build Vyom EXE

run-name: Vyom EXE | branch=${{ github.ref_name }} | commit=${{ github.sha }}

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Verify Exact Build Source
        shell: powershell
        run: |
          Write-Host "BUILD BRANCH: $env:GITHUB_REF_NAME"
          Write-Host "BUILD REF:    $env:GITHUB_REF"
          Write-Host "BUILD SHA:    $env:GITHUB_SHA"
          $checked = git rev-parse HEAD
          Write-Host "CHECKED SHA:  $checked"

          if ($checked -ne $env:GITHUB_SHA) {
              Write-Error "Checked source does not match workflow SHA."
              exit 1
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pytest

          if (Test-Path "requirements.txt") {
              python -m pip install -r requirements.txt
          }

          python -m pip install SpeechRecognition PyAudio pyttsx3

      - name: Verify Project Structure
        shell: powershell
        run: |
          $requiredFiles = @(
              "ai_core/main.py",
              "ai_core/autonomous_agent.py",
              "ai_core/brain.py",
              "ai_core/reasoning_engine.py",
              "ai_core/reasoning_gateway.py",
              "ai_core/action_schema.py",
              "ai_core/action_validator.py",
              "ai_core/capability_registry.py",
              "ai_core/capability_resolver.py",
              "ai_core/capability_executor.py",
              "ai_core/ui_autonomous_agent.py",
              "ai_core/mission_planner.py",
              "ai_core/model_gateway.py",
              "ai_core/skill_builder.py",
              "ai_core/skill_registry.py",
              "command_engine/executor.py",
              "command_engine/intent.py",
              "tools/tool_manager.py",
              "tools/universal_app_launcher.py",
              "tools/universal_resolver.py",
              "memory/selection_manager.py",
              "windows_agent/process_manager.py",
              "windows_agent/window_manager.py",
              "windows_agent/input_controller.py",
              "windows_agent/clipboard_manager.py",
              "windows_agent/screen_observer.py",
              "windows_agent/ui_automation.py",
              "voice/voice_controller.py",
              "voice/speech_to_text.py",
              "voice/text_to_speech.py"
          )

          foreach ($file in $requiredFiles) {
              if (!(Test-Path $file)) {
                  Write-Error "Missing required file: $file"
                  exit 1
              }
              Write-Host "FOUND: $file"
          }

      - name: Python Syntax Check
        shell: powershell
        run: |
          python -m compileall -q `
            ai_core `
            command_engine `
            tools `
            memory `
            windows_agent `
            voice `
            tests

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Python syntax check failed."
              exit 1
          }

      - name: Core Import Check
        shell: powershell
        run: |
          python -c "import ai_core; import ai_core.autonomous_agent; import ai_core.reasoning_engine; import ai_core.reasoning_gateway; import ai_core.action_schema; import ai_core.action_validator; import ai_core.capability_registry; import ai_core.capability_resolver; import ai_core.capability_executor; import ai_core.ui_autonomous_agent; import ai_core.mission_planner; import command_engine.executor; import tools.tool_manager; import windows_agent.window_manager; import windows_agent.input_controller; import windows_agent.clipboard_manager; import windows_agent.screen_observer; import windows_agent.ui_automation; print('VYOM CORE + STEP2 IMPORT TEST PASSED')"

      - name: Voice Import Check
        shell: powershell
        run: |
          python -c "import voice; import voice.voice_controller; import voice.speech_to_text; import voice.text_to_speech; print('VOICE IMPORT TEST PASSED')"

      - name: Run Complete Test Suite
        shell: powershell
        run: |
          python -m pytest tests -q
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Pytest suite failed. EXE build stopped."
              exit 1
          }
          Write-Host "COMPLETE PYTEST SUITE PASSED."

      - name: Clean Build
        shell: powershell
        run: |
          if (Test-Path "build") { Remove-Item -Recurse -Force "build" }
          if (Test-Path "dist") { Remove-Item -Recurse -Force "dist" }
          if (Test-Path "Vyom.spec") { Remove-Item -Force "Vyom.spec" }

      - name: Build Complete Vyom EXE
        shell: powershell
        run: |
          python -m PyInstaller `
            --onefile `
            --clean `
            --noconfirm `
            --console `
            --paths "." `
            --collect-submodules ai_core `
            --collect-submodules command_engine `
            --collect-submodules tools `
            --collect-submodules memory `
            --collect-submodules windows_agent `
            --collect-submodules voice `
            --hidden-import ai_core.autonomous_agent `
            --hidden-import ai_core.brain `
            --hidden-import ai_core.reasoning_engine `
            --hidden-import ai_core.reasoning_gateway `
            --hidden-import ai_core.action_schema `
            --hidden-import ai_core.action_validator `
            --hidden-import ai_core.capability_registry `
            --hidden-import ai_core.capability_resolver `
            --hidden-import ai_core.capability_executor `
            --hidden-import ai_core.ui_autonomous_agent `
            --hidden-import ai_core.mission_planner `
            --hidden-import ai_core.model_gateway `
            --hidden-import ai_core.capability_manager `
            --hidden-import ai_core.skill_builder `
            --hidden-import ai_core.skill_registry `
            --hidden-import command_engine.executor `
            --hidden-import command_engine.intent `
            --hidden-import tools.tool_manager `
            --hidden-import tools.universal_app_launcher `
            --hidden-import tools.universal_resolver `
            --hidden-import memory.selection_manager `
            --hidden-import windows_agent.process_manager `
            --hidden-import windows_agent.window_manager `
            --hidden-import windows_agent.input_controller `
            --hidden-import windows_agent.clipboard_manager `
            --hidden-import windows_agent.screen_observer `
            --hidden-import windows_agent.ui_automation `
            --hidden-import voice.voice_controller `
            --hidden-import voice.speech_to_text `
            --hidden-import voice.text_to_speech `
            --name Vyom `
            ai_core/main.py

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Vyom.exe build failed."
              exit 1
          }

      - name: Verify Vyom EXE
        shell: powershell
        run: |
          if (!(Test-Path "dist/Vyom.exe")) {
              Write-Error "Vyom.exe was not created."
              exit 1
          }

          $size = (Get-Item "dist/Vyom.exe").Length
          Write-Host "Vyom.exe size: $size bytes"

          if ($size -lt 100000) {
              Write-Error "Vyom.exe appears too small."
              exit 1
          }

          Write-Host "VYOM EXE VERIFIED."

      - name: Upload Vyom EXE
        uses: actions/upload-artifact@v4
        with:
          name: Vyom_EXE
          path: dist/Vyom.exe
          if-no-files-found: error
          retention-days: 7

      - name: Build Summary
        shell: powershell
        run: |
          Write-Host "=============================================="
          Write-Host " VYOM BUILD SUCCESS"
          Write-Host " Branch: $env:GITHUB_REF_NAME"
          Write-Host " SHA:    $env:GITHUB_SHA"
          Write-Host "=============================================="
